name: Update writing from Substack

on:
  schedule:
    - cron: "17 1,13 * * *" # Two widely spaced attempts per day, UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-writing
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Substack feed
        env:
          FEED_URL: "https://substack-feed.hazemabdelmughni.workers.dev/"
        run: |
          code=$(curl -sS --compressed --max-time 60 -w '%{http_code}' \
            -H "Accept: application/rss+xml, application/xml;q=0.9, */*;q=0.5" \
            "$FEED_URL" -o feed.xml) || code="000"
          if [ "$code" != "200" ] || [ ! -s feed.xml ]; then
            echo "::error::Feed unavailable (HTTP $code). The next scheduled run will try again."
            exit 1
          fi
      - name: Regenerate writing list from feed
        run: python3 scripts/update_writing.py feed.xml
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain index.html)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Auto-update writing list from Substack"
            git push
          else
            echo "No changes to commit."
          fi
