name: Update writing from Substack

on:
  schedule:
    - cron: "0 12 * * *"   # daily at 12:00 UTC
  workflow_dispatch:        # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-writing
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Substack/Cloudflare blocks GitHub's runner IP range, so FEED_URL points at a
      # relay that fetches from a non-blocked IP (Cloudflare Worker — see
      # scripts/feed-proxy.worker.js).
      #
      # Substack also rate-limits (HTTP 429). Retries must be spread over minutes, not
      # seconds: bunched retries all land inside the same throttle window and fail
      # together, which silently skipped updates. Back off 30s/60s/90s/120s (~5 min).
      - name: Fetch Substack feed (skips if blocked/unreachable)
        env:
          FEED_URL: "https://substack-feed.hazemabdelmughni.workers.dev/"
        run: |
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS --compressed -w '%{http_code}' \
              -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
              -H "Accept: application/rss+xml, application/xml;q=0.9, */*;q=0.5" \
              -H "Cache-Control: no-cache" \
              "$FEED_URL" -o feed.xml) || code="000"
            if [ "$code" = "200" ] && [ -s feed.xml ]; then
              echo "fetched $(wc -c < feed.xml) bytes on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt/5 failed (HTTP $code)"
            rm -f feed.xml
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 30)); fi
          done
          echo "::warning::Feed unreachable after 5 attempts over ~5 minutes (last HTTP $code). Skipping update."

      - name: Regenerate writing list from the feed
        run: |
          if [ -s feed.xml ]; then
            python3 scripts/update_writing.py feed.xml
          else
            echo "No feed fetched — nothing to update this run."
          fi

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain index.html)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Auto-update writing list from Substack"
            git push
            echo "Pushed updated writing list."
          else
            echo "No changes to commit."
          fi
